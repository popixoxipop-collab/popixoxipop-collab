<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Rainbow engineering profile banner</title>
  <desc id="desc">Dark blue banner with rainbow accent lines, colorful orbital rings and Engineering meets Intelligence headline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091226"/><stop offset=".52" stop-color="#111B35"/><stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5669"/><stop offset=".17" stop-color="#FF9D4D"/><stop offset=".34" stop-color="#FFE56D"/>
      <stop offset=".51" stop-color="#55DDA1"/><stop offset=".68" stop-color="#4CB8FF"/><stop offset=".84" stop-color="#8F83FF"/><stop offset="1" stop-color="#EA79DC"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6977"/><stop offset=".32" stop-color="#F6C963"/><stop offset=".62" stop-color="#4CCDB8"/><stop offset=".82" stop-color="#559FFF"/><stop offset="1" stop-color="#B98BFF"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F6FF"/><stop offset="1" stop-color="#BBD0F0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
