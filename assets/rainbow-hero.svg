    <text x="58" y="250" fill="#CBD7EC" font-size="19" font-weight="600" font-family="Arial, sans-serif" letter-spacing="2.3">SIMULATE  •  LEARN  •  BUILD  •  CONNECT</text>
    <g transform="translate(989 163)">
