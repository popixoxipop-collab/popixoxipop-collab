    <path d="M-45 291Q208 190 481 290T1009 286T1315 208" fill="none" stroke="url(#rainbow)" stroke-width="4" opacity=".42"/>
    <path d="M-15 312Q220 214 493 311T1014 302T1240 277" fill="none" stroke="#6695CD" stroke-width="2" opacity=".33"/>
    <text x="58" y="57" fill="#ACBEDB" font-size="18" font-weight="650" font-family="Arial, sans-serif" letter-spacing="4">GITHUB / POPIXOXIPOP-COLLAB</text>
