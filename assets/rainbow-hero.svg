      <circle r="58" stroke="url(#ring)" stroke-width="7" fill="none" opacity=".87"/>
      <circle r="24" fill="#111D36" stroke="#80C1FF" stroke-width="3"/>
      <path d="M-133 52L130 -59" stroke="#C7D6F2" stroke-width="2" opacity=".32"/>
      <path d="M-112 -94L102 94" stroke="#C7D6F2" stroke-width="2" opacity=".29"/>
      <circle cx="-104" cy="-65" r="9" fill="#FF7E79"/>
      <circle cx="111" cy="56" r="9" fill="#64D8BE"/>
      <circle cx="9" cy="-117" r="7" fill="#A18BFF"/>
