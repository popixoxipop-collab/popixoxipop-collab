name: Update rainbow contribution calendar

on:
  schedule:
    - cron: "17 3 * * *" # Daily 12:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-rainbow-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the latest GitHub contribution SVG
        run: python scripts/update_rainbow.py
      - name: Commit updated SVG, if changed
        run: |
          if git diff --quiet -- assets/rainbow-contributions.svg; then
            echo "No change to contribution graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rainbow-contributions.svg
          git commit -m "docs(profile): refresh GitHub rainbow contribution calendar"
          git push
